spring.application.name=eMSP-Simulator

# Database configuration for Docker
spring.datasource.url=jdbc:mysql://mysql:3306/emsp_simulator
spring.datasource.username=emsp_user
spring.datasource.password=emsp_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server port (override default 8081)
server.port=8080

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
