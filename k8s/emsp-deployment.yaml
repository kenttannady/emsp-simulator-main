apiVersion: apps/v1
kind: Deployment
metadata:
  name: emsp-simulator-deployment
  namespace: emsp-simulator
  labels:
    app: emsp-simulator
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emsp-simulator
  template:
    metadata:
      labels:
        app: emsp-simulator
        tier: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: emsp-simulator
        image: ghcr.io/kenttannady/emsp-simulator:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: emsp-simulator-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: emsp-simulator-secrets
              key: SPRING_DATASOURCE_PASSWORD
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: emsp-simulator-service
  namespace: emsp-simulator
  labels:
    app: emsp-simulator
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: emsp-simulator
  type: LoadBalancer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emsp-simulator-ingress
  namespace: emsp-simulator
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: emsp-simulator.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emsp-simulator-service
            port:
              number: 8080
