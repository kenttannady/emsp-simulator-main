version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: emsp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: emsp_simulator
      MYSQL_USER: emsp_user
      MYSQL_PASSWORD: emsp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - emsp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # eMSP Simulator Application
  emsp-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emsp-simulator-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emsp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Adminer (Database Management Tool)
  adminer:
    image: adminer:latest
    container_name: emsp-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - emsp-network

volumes:
  mysql_data:
    driver: local

networks:
  emsp-network:
    driver: bridge
