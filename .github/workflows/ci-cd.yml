name: Deploy to Docker Desktop

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: emsp-simulator

jobs:
  # Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}

  # Deploy to Kubernetes (Self-hosted runner)
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        kubectl version --client
        
    - name: Setup kubeconfig
      run: |
        mkdir -p $HOME/.kube
        cp /home/runner/.kube/config $HOME/.kube/config
        
        # Fix server address for container
        sed -i 's/127.0.0.1/localhost/g' $HOME/.kube/config
        sed -i 's/host.docker.internal/localhost/g' $HOME/.kube/config
        
        export KUBECONFIG=$HOME/.kube/config
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        
        # Test connection
        kubectl get nodes
        
    - name: Deploy to Kubernetes
      run: |
        # Create namespace if not exists
        kubectl create namespace emsp-simulator --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply to Kubernetes
        kubectl apply -k k8s/
        
        # Wait for deployment
        sleep 10
        kubectl rollout status deployment/emsp-simulator-deployment -n emsp-simulator --timeout=300s
        
    - name: Show status
      run: |
        echo "=== Deployment Status ==="
        kubectl get all -n emsp-simulator
        echo "✅ eMSP Simulator deployed successfully!"
